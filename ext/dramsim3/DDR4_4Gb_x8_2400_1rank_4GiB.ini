# DDR4-2400 4Gb x8, single channel, single rank, 4GiB.
#
# Derived from DDR4_4Gb_x8_2400_2.ini for the DDR4-2400 4Gb x8 study.
# The reference timing source is the DRAMSys memspec
# ext/dramsys/DRAMSys/configs/memspec/JEDEC_4Gb_DDR4-2400_8bit_A.json.
#
# Edits relative to DDR4_4Gb_x8_2400_2.ini:
#   [timing]  tCK = 0.833   (was 0.83;  matches DRAMSys tCK = 833e-12 s)
#   [timing]  CWL = 16      (was 12;    matches DRAMSys WL = 16)
#   [timing]  tRTP = 12     (was 9;     matches DRAMSys RTP = 12)
#   [system]  channel_size = 4096 (was 8192; one rank for this 4Gb x8 part)
#   [system]  channels = 1, bus_width = 64 (unchanged, stated explicitly)
#
# channel_size = 4096 (MiB) makes DRAMSim3 derive exactly one rank for the
# 4Gb x8 geometry (8 devices * 512 MiB = 4096 MiB). The stock 8192 yields two
# ranks. trans_queue_size = 32 has no direct DRAMSys/gem5 equivalent and is
# recorded in the run metadata.

[dram_structure]
protocol = DDR4
bankgroups = 4
banks_per_group = 4
rows = 32768
columns = 1024
device_width = 8
BL = 8

[timing]
tCK = 0.833
AL = 0
CL = 16
CWL = 16
tRCD = 16
tRP = 16
tRAS = 39
tRFC = 312
tRFC2 = 192
tRFC4 = 132
tREFI = 9360
tRPRE = 1
tWPRE = 1
tRRD_S = 4
tRRD_L = 6
tWTR_S = 3
tWTR_L = 9
tFAW = 26
tWR = 18
tWR2 = 19
tRTP = 12
tCCD_S = 4
tCCD_L = 6
tCKE = 6
tCKESR = 7
tXS = 324
tXP = 8
tRTRS = 1

[power]
VDD = 1.2
IDD0 = 60
IPP0 = 3.0
IDD2P = 29
IDD2N = 45
IDD3P = 40
IDD3N = 60
IDD4W = 175
IDD4R = 145
IDD5AB = 175
IDD6x = 20

[system]
channel_size = 4096
channels = 1
bus_width = 64
address_mapping = rochrababgco
queue_structure = PER_BANK
refresh_policy = RANK_LEVEL_STAGGERED
row_buf_policy = OPEN_PAGE
cmd_queue_size = 8
trans_queue_size = 32

[other]
epoch_period = 1204819
output_level = 1
